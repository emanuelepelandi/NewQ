<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111317">
<title>NewQ Remote</title>
<style>
  :root {
    --window: #111317; --raised: #1b1e24; --control: #23272e; --inset: #0d0f12;
    --border: #262a31; --border-strong: #373c46; --text: #e4e7ec; --muted: #7a818d;
    --accent: #5b8dd6; --error: #e2625d; --go: #2f8f5e; --go-hover: #36a069;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--window); color: var(--text); display: flex; align-items: center; justify-content: center; padding: 16px;
    font: 14px/1.35 "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
  }
  form { width: 100%; max-width: 340px; background: var(--raised); border: 1px solid var(--border); border-radius: 8px; padding: 24px; }
  h1 { font-size: 20px; font-weight: 600; margin: 0 0 4px; }
  .caption { font-size: 11px; font-weight: 600; letter-spacing: .06em; color: var(--muted); text-transform: uppercase; margin: 16px 0 6px; }
  input {
    width: 100%; font: inherit; font-size: 16px; color: var(--text); background: var(--inset);
    border: 1px solid var(--border-strong); border-radius: 6px; padding: 12px;
  }
  input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  button {
    width: 100%; margin-top: 16px; min-height: 48px; font: inherit; font-weight: 600; font-size: 16px; color: #fff;
    background: var(--go); border: 1px solid var(--go); border-radius: 6px; cursor: pointer;
  }
  button:hover { background: var(--go-hover); }
  .error { color: var(--error); font-size: 13px; margin-top: 10px; min-height: 18px; }
</style>
</head>
<body>
  <form method="post" action="/login">
    <h1>NewQ Remote</h1>
    <label class="caption" for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" autofocus required>
    <div class="error" id="error"></div>
    <button type="submit">Accedi</button>
  </form>
<script>
  const e = new URLSearchParams(location.search).get("e");
  document.getElementById("error").textContent =
    e === "password" ? "Password errata." : e === "blocked" ? "Troppi tentativi: riprova tra 30 secondi." : "";
  if (e) history.replaceState(null, "", "/");
</script>
</body>
</html>
